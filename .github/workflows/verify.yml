name: Verify club application
on:
  push:
    branches: [audit-fixes-v2, audit-fixes, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      hosted_origin:
        description: Optional read-only hosted HTTP smoke (does not certify this commit is deployed)
        type: choice
        default: skip
        options:
          - skip
          - https://audit-release-check--oklahoma-prospects.netlify.app
          - https://prospectsbaseball.club
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm run build
        env:
          NETLIFY: "true"
          CONTEXT: deploy-preview
          STRIPE_LIVE_ENABLED: "false"
      - run: npm run verify:build
      - name: Read-only hosted HTTP smoke
        if: github.event_name == 'workflow_dispatch' && inputs.hosted_origin != 'skip'
        run: npm run verify:hosted -- "$HOSTED_ORIGIN"
        env:
          HOSTED_ORIGIN: ${{ inputs.hosted_origin }}
