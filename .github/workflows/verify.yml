name: Verify club application
on:
  push:
    branches: [audit-fixes]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm run build
        env:
          NETLIFY: "true"
          CONTEXT: deploy-preview
          STRIPE_LIVE_ENABLED: "false"
      - run: npm run verify:build
