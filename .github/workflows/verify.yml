name: Verify club application
on:
  push:
    branches: [square-payments, audit-fixes-v2, audit-fixes, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      hosted_origin:
        description: Optional read-only hosted HTTP smoke (does not certify this commit is deployed)
        type: choice
        default: skip
        options:
          - skip
          - https://audit-release-check--oklahoma-prospects.netlify.app
          - https://prospectsbaseball.club
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NETLIFY: "true"
          # This is an offline synthetic build, not a hosted Netlify preview.
          # Actual preview builds receive SITE_ID and DEPLOY_PRIME_URL from Netlify.
          CONTEXT: dev
          SQUARE_LIVE_ENABLED: "false"
          SQUARE_ENVIRONMENT: sandbox
      - run: npm run verify:build
      - run: npx playwright install --with-deps chromium
      - name: Isolated coordinator permissions walkthrough
        run: node scripts/check-coordinator.mjs
      - name: Nonfinancial tournament finder component walkthrough
        run: node scripts/check-organization-tournaments-ui.mjs
      - name: Isolated tournament finder walkthrough
        run: node --import tsx scripts/check-tournament-finder.mjs
      - name: Authenticated isolated instructor walkthrough
        run: npm run test:guided:browser
        env:
          NETLIFY: "true"
          LESSON_FULL_APP: "true"
          LESSON_SCREENSHOT_DIR: artifacts/guided-lessons
      - name: Public navigation and tryout walkthrough
        run: node scripts/public-ux-walkthrough.mjs
        env:
          NETLIFY: "true"
          PUBLIC_UX_SCREENSHOTS: artifacts/guided-lessons/public-ux
      - name: Isolated coach tryout center walkthrough
        run: node scripts/check-tryout-center.mjs
      - name: Isolated shop walkthrough
        run: node scripts/shop-walkthrough.mjs
      # Run the real interaction loop first so interface failures are found promptly.
      - run: npm test
      - run: npm run lint
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guided-lesson-walkthrough
          path: |
            artifacts/guided-lessons
            artifacts/tryout-center
            artifacts/shop
            artifacts/coordinator
            artifacts/tournament-finder
          if-no-files-found: ignore
      - name: Read-only hosted HTTP smoke
        if: github.event_name == 'workflow_dispatch' && inputs.hosted_origin != 'skip'
        run: npm run verify:hosted -- "$HOSTED_ORIGIN"
        env:
          HOSTED_ORIGIN: ${{ inputs.hosted_origin }}
