# Oklahoma Prospects — prospectsbaseball.club
# This file is the club app (TanStack Start), not the old static HTML site.

[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"
  # Local Netlify CLI builds also need the Netlify adapter and migration output.
  NETLIFY = "true"

[dev]
  command = "npm run dev"
  port = 8080

# Old static-site paths that families and Google still hit.
[[redirects]]
  from = "/visit"
  to = "/visits"
  status = 301
  force = true

[[redirects]]
  from = "/check-in"
  to = "/visits"
  status = 301
  force = true

[[redirects]]
  from = "/checkin"
  to = "/visits"
  status = 301
  force = true

[[redirects]]
  from = "https://oklahoma-prospects.netlify.app/*"
  to = "https://prospectsbaseball.club/:splat"
  status = 301
  force = true

# Preview authentication and commerce require separately scoped test credentials.
[context.deploy-preview.environment]
  STRIPE_LIVE_ENABLED = "false"
[context.branch-deploy.environment]
  STRIPE_LIVE_ENABLED = "false"

# SSR/function routing is emitted by the TanStack adapter. A /* /index.html
# rewrite here would hide real API responses and the 404 status.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "object-src 'none'; base-uri 'self'; frame-ancestors 'self' https://grok.com https://*.grok.com"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "http://prospectsbaseball.club/*"
  to = "https://prospectsbaseball.club/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.prospectsbaseball.club/*"
  to = "https://prospectsbaseball.club/:splat"
  status = 301
  force = true
