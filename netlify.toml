[build]
  command = "node scripts/build.mjs"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Host-level: Netlify default subdomain → club domain.
# book. and app. are separate Netlify sites; their 301s live in
# booking-site/_redirects and booking-site/development/_redirects.
[[redirects]]
  from = "https://oklahoma-prospects.netlify.app/*"
  to = "https://prospectsbaseball.club/:splat"
  status = 301
  force = true
