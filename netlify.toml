# Oklahoma Prospects — prospectsbaseball.club
# This file is the club app (TanStack Start), not the old static HTML site.

[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"

[dev]
  command = "npm run dev"
  port = 8080

# Old static-site paths that families and Google still hit.
[[redirects]]
  from = "/visit"
  to = "/visits"
  status = 301
  force = true

[[redirects]]
  from = "/check-in"
  to = "/visits"
  status = 301
  force = true

[[redirects]]
  from = "/checkin"
  to = "/visits"
  status = 301
  force = true

[[redirects]]
  from = "https://oklahoma-prospects.netlify.app/*"
  to = "https://prospectsbaseball.club/:splat"
  status = 301
  force = true
